kind = "web"
previewPath = "/"
title = "Cambridge Montessori School"
version = "1.0.0"
id = "artifacts/cambridge-montessori"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21764

[services.development]
run = "pnpm --filter @workspace/cambridge-montessori run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cambridge-montessori", "run", "build" ]
serve = "static"
publicDir = "artifacts/cambridge-montessori/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21764"
BASE_PATH = "/"
